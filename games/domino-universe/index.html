<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Domino Universe · No Stress Here</title>
  <meta name="description" content="Build anything out of dominoes in 3D, then push the first one and watch every single one fall." />
  <script src="../../assets/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="domino.css" />
</head>
<body class="dm-body">
  <header class="site-header">
    <a class="logo" href="../../index.html"><span class="logo-mark" aria-hidden="true"></span>No Stress <span class="here">Here</span></a>
    <div class="header-actions">
      <a class="pill-btn" href="../../index.html" title="Back to all games">← <span class="theme-label">Games</span></a>
      <button class="pill-btn" type="button" data-theme-toggle aria-pressed="false">
        <span class="theme-icon" aria-hidden="true"></span><span class="theme-label">Dark</span>
      </button>
    </div>
  </header>

  <div class="dm-app" id="app">
    <div class="topbar">
      <div class="tb-group">
        <button class="tb" type="button" id="menuBtn" title="Main menu">🏠</button>
        <span class="mode-label" id="modeLabel">Free Build</span>
      </div>
      <div class="tb-group">
        <button class="tb" type="button" id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
        <button class="tb" type="button" id="redoBtn" title="Redo (Ctrl+Y)">↷</button>
        <button class="tb" type="button" id="randomBtn" title="Random arrangement">🎲</button>
        <button class="tb" type="button" id="clearBtn" title="Clear everything">🗑️</button>
        <button class="tb" type="button" id="saveBtn" title="Save creation">💾</button>
        <button class="tb" type="button" id="openBtn" title="My creations">📂</button>
      </div>
      <div class="tb-group">
        <button class="tb" type="button" id="envBtn" title="Environment">🌍</button>
        <button class="tb" type="button" id="setBtn" title="Settings">⚙️</button>
        <button class="tb" type="button" id="shotBtn" title="Screenshot">📸</button>
        <button class="tb" type="button" id="fullBtn" title="Fullscreen">⤢</button>
      </div>
    </div>

    <div class="workspace">
      <aside class="tools" id="tools" aria-label="Building tools"></aside>

      <div class="stage" id="stage">
        <div class="hud" id="hud">
          <div class="pill" id="countPill">0 dominoes</div>
          <div class="pill goal" id="goalPill" hidden></div>
        </div>
        <div class="hint" id="hint"></div>
        <div class="views" id="views">
          <button data-view="orbit" title="Free camera (right-drag to rotate, wheel to zoom)">🎥</button>
          <button data-view="top" title="Top-down">⬇️</button>
          <button data-view="side" title="Side view">↔️</button>
          <button data-view="follow" title="Follow the falling dominoes">🎯</button>
          <button data-view="first" title="First-person ride-along">👁️</button>
        </div>
        <div class="runbar" id="runbar">
          <button class="run go" type="button" id="startBtn">▶ Start</button>
          <button class="run" type="button" id="stopBtn" hidden>■ Stop</button>
          <button class="run" type="button" id="resetBtn" hidden>↺ Reset</button>
          <button class="run small" type="button" id="slowBtn" title="Slow motion">🐢</button>
          <button class="run small" type="button" id="replayBtn" title="Cinematic replay" hidden>🎬</button>
          <button class="run small" type="button" id="recBtn" title="Record a video">⏺</button>
        </div>
        <div class="menu" id="menu"></div>
      </div>

      <aside class="side" id="side"></aside>
    </div>
  </div>

  <div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../../assets/vendor/three.js"></script>
  <script src="../../assets/vendor/cannon-es.js"></script>
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/world.js"></script>
  <script src="js/build.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
